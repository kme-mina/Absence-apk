name: Build Paid Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paid-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Paid APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Validate project files
        shell: bash
        run: |
          set -eu

          test -f package.json
          test -f src/admin.html
          test -f keys/public_key.txt
          test -f scripts/build-variants.js
          test -f scripts/write-capacitor-config.js

          node --version
          npm --version
          java -version

      - name: Install dependencies
        shell: bash
        run: |
          set -eu

          npm install --legacy-peer-deps

          echo "=== Installed dependencies ==="
          npm ls @capacitor/core @capacitor/cli @capacitor/android xlsx --depth=0

          echo "=== npm omit configuration ==="
          npm config get omit

      - name: Verify required packages
        shell: bash
        run: |
          set -eu

          node -e "console.log('Capacitor CLI:', require.resolve('@capacitor/cli'))"
          node -e "console.log('Capacitor Android:', require.resolve('@capacitor/android/package.json'))"
          node -e "console.log('Capacitor Core:', require.resolve('@capacitor/core'))"

          test -f node_modules/xlsx/dist/xlsx.full.min.js || {
            echo "::error::Local XLSX library is missing"
            exit 1
          }

      - name: Configure paid variant
        run: npm run config:paid

      - name: Build paid web application
        run: npm run build:apk-web

      - name: Verify paid web assets
        shell: bash
        run: |
          set -eu

          test -s www/index.html || {
            echo "::error::www/index.html was not generated"
            exit 1
          }

          test -s www/xlsx.full.min.js || {
            echo "::error::Bundled XLSX library is missing"
            exit 1
          }

          if grep -q 'BUILD_MODE = "ADMIN"' www/index.html; then
            echo "::error::ADMIN mode remains in the paid application"
            exit 1
          fi

          if ! grep -q 'BUILD_MODE = "APK"' www/index.html; then
            echo "::error::Paid APK mode was not detected"
            exit 1
          fi

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android project
        shell: bash
        run: |
          set -eu

          test -f android/gradlew || {
            echo "::error::Gradle wrapper is missing"
            exit 1
          }

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            echo "::error::Android app Gradle configuration is missing"
            exit 1
          fi

          chmod +x android/gradlew

      - name: Build Debug APK
        shell: bash
        working-directory: android
        run: |
          set -eu
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -eu

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK" || {
            echo "::error::APK was not generated or is empty"
            exit 1
          }

          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hasr-alghiyab-paid-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
