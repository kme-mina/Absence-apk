name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Project & APK
        run: |
          # العثور على المجلد الأصلي ونسخه لمجلد مؤقت إنجليزي
          SRC_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          echo "Source directory: $SRC_DIR"
          
          mkdir -p /tmp/build_dir
          cp -r "$SRC_DIR"/* /tmp/build_dir/
          
          cd /tmp/build_dir
          npm install --legacy-peer-deps
          
          # التأكد من وجود مجلد www أو إنشاؤه/نسخه من src لكي لا يظهر خطأ Capacitor
          if [ ! -d "www" ]; then
            if [ -d "src" ]; then
              mkdir -p www
              cp -r src/* www/
            else
              mkdir -p www
              touch www/index.html
            fi
          fi
          
          npx cap add android || true
          npx cap sync android
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "/tmp/build_dir/android/app/build/outputs/apk/debug/app-debug.apk"
